<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0d0d0f; color: #ececec; }
  
  header { background: linear-gradient(120deg, #000, #3b0a0a 60%, #b91c1c); padding: 18px 20px; border-bottom: 2px solid #dc2626; }
  header .in { max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 22px; color: #fff; }
  
  main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  h2 { font-size: 18px; color: #f87171; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  
  input, select { padding: 8px 12px; font-size: 13px; border: 1px solid #3a3a42; border-radius: 6px; background: #101012; color: #ececec; outline: none; }
  input:focus, select:focus { border-color: #dc2626; }
  
  button { padding: 8px 14px; font-size: 13px; font-weight: 600; color: #fff; border: 0; border-radius: 6px; cursor: pointer; background: linear-gradient(135deg, #dc2626, #7f1d1d); }
  button:hover { filter: brightness(1.15); }
  button.red { background: #27272a; border: 1px solid #dc2626; color: #f87171; }
  button.light { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); }
  
  /* Projects */
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .proj-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; min-height: 32px; }
  .proj { cursor: pointer; padding: 6px 14px; border-radius: 20px; background: #26262b; color: #d4d4d8; font-size: 13px; border: 1px solid #3a3a42; }
  .proj.on { background: #dc2626; color: #fff; border-color: #dc2626; font-weight: 600; }
  
  /* Task Form & Dates */
  .form-box { background: #121215; border: 1px solid #27272a; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  .date-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
  .date-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #a1a1aa; }
  
  /* Table */
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; font-size: 12px; color: #fff; padding: 10px; background: #200a0a; border-bottom: 2px solid #dc2626; }
  td { padding: 10px; border-bottom: 1px solid #27272a; font-size: 13px; }
  tr:hover td { background: #1a1a1f; }
  
  /* Badges & Indicators */
  .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #fff; }
  .badge.low { background: #3f3f46; } .badge.medium { background: #b45309; } .badge.high { background: #dc2626; }
  
  .ind { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; }
  .ind.green { background: #10b981; color: #fff; }
  .ind.yellow { background: #facc15; color: #000; }
  .ind.red { background: #ef4444; color: #fff; }
  
  .late { color: #f87171; font-weight: 700; }
  #msg { color: #f87171; min-height: 20px; font-weight: 600; margin-bottom: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="in">
    <h1>Task Manager</h1>
    <div id="whoBox" hidden><span id="who"></span> <button class="light" onclick="logout()">Logout</button></div>
  </div>
</header>

<main>
  <p id="msg"></p>

  <div id="appBox" hidden>
    <!-- 1. PROJECTS -->
    <div class="card">
      <h2>
        <span>Projects</span>
        <span id="projCount" style="font-size:13px; color:#a1a1aa;"></span>
      </h2>
      <div class="row">
        <input id="projFilter" placeholder=" Search projects..." oninput="renderProjects()" style="flex:1;">
        <input id="projName" placeholder="New project name" style="flex:1;">
        <button onclick="addProject()">Add Project</button>
        <button class="red" onclick="deleteProject()">Delete Selected</button>
      </div>
      <div class="proj-list" id="projects"></div>
    </div>

    <!-- 2. TASKS -->
    <div class="card">
      <h2>Tasks <span id="projTitle" style="color:#a1a1aa; font-weight:normal;"></span></h2>
      
      <!-- ADD TASK FORM -->
      <div class="form-box">
        <div class="row">
          <input id="taskTitle" placeholder="Task title" style="flex:2; min-width:180px;">
          <select id="taskPriority">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
          <button onclick="addTask()">Add Task</button>
        </div>
        <div class="date-grid">
          <div class="date-field">
            <label>Assigned Date</label>
            <input id="taskAssigned" type="date">
          </div>
          <div class="date-field">
            <label>Submission Date</label>
            <input id="taskSubmit" type="date">
          </div>
          <div class="date-field">
            <label>Due Date</label>
            <input id="taskDue" type="date">
          </div>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="row" style="background:#121215; padding:8px 12px; border-radius:6px;">
        <label style="font-size:13px; color:#a1a1aa;">Status:
          <select id="fStatus" onchange="loadTasks()">
            <option value="">All</option>
            <option value="todo">Todo</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label style="font-size:13px; color:#a1a1aa;">Date View:
          <select id="fDateSection" onchange="renderTasks()">
            <option value="all">All Dates</option>
            <option value="assigned">Assigned</option>
            <option value="submit">Pending Submit</option>
            <option value="due">Due / Overdue</option>
          </select>
        </label>
      </div>

      <!-- TASK TABLE -->
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Priority</th>
            <th>Assigned</th>
            <th>Submit</th>
            <th>Due</th>
            <th>Status</th>
            <th>Indicator</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tasks"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
// --- State & Helpers ---
var token = localStorage.getItem('token');
var projectId = null;
var allProjects = [];
var loadedTasks = [];

var $ = function (id) { return document.getElementById(id); };
var showMsg = function (t) { $('msg').textContent = t || ''; };

// Default assigned date to today
$('taskAssigned').value = new Date().toISOString().slice(0, 10);

// API Fetch Helper
async function api(method, url, body) {
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  var res = await fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
  var json = await res.json();
  if (!json.success) throw new Error(json.error.message || 'Request failed');
  return json;
}

function logout() {
  api('POST', '/api/auth/logout').catch(function () {});
  localStorage.removeItem('token');
  window.location.href = '/login.html';
}

function start(user) {
  $('who').textContent = user.name;
  $('whoBox').hidden = false;
  $('appBox').hidden = false;
  loadProjects();
}

// --- Projects ---
async function loadProjects() {
  try {
    var r = await api('GET', '/api/projects?limit=100');
    allProjects = r.data || [];
    renderProjects();
  } catch (e) { showMsg(e.message); }
}

function renderProjects() {
  var q = ($('projFilter').value || '').trim().toLowerCase();
  var filtered = allProjects.filter(function (p) { return !q || p.name.toLowerCase().includes(q); });
  
  $('projCount').textContent = filtered.length + ' / ' + allProjects.length;
  var box = $('projects');
  box.innerHTML = '';

  if (allProjects.length === 0) {
    box.textContent = 'No projects yet. Create one above.';
    projectId = null;
    loadTasks();
    return;
  }

  if (!filtered.some(function (p) { return p.id === projectId; })) {
    projectId = filtered[0] ? filtered[0].id : null;
  }

  filtered.forEach(function (p) {
    var s = document.createElement('span');
    s.className = 'proj' + (p.id === projectId ? ' on' : '');
    s.textContent = p.name;
    s.onclick = function () { projectId = p.id; renderProjects(); loadTasks(); };
    box.appendChild(s);
  });

  var cur = allProjects.find(function (p) { return p.id === projectId; });
  $('projTitle').textContent = cur ? '— ' + cur.name : '';
  loadTasks();
}

async function addProject() {
  var name = $('projName').value.trim();
  if (!name) return showMsg('Enter project name');
  try {
    var r = await api('POST', '/api/projects', { name: name });
    $('projName').value = '';
    projectId = r.data.id;
    showMsg('');
    loadProjects();
  } catch (e) { showMsg(e.message); }
}

async function deleteProject() {
  if (!projectId || !confirm('Delete selected project and its tasks?')) return;
  try {
    await api('DELETE', '/api/projects/' + projectId);
    projectId = null;
    showMsg('');
    loadProjects();
  } catch (e) { showMsg(e.message); }
}

// --- Tasks ---
async function loadTasks() {
  if (!projectId) { $('tasks').innerHTML = '<tr><td colspan="8" style="text-align:center;">Select a project</td></tr>'; return; }
  try {
    var url = '/api/tasks?limit=100&projectId=' + projectId;
    if ($('fStatus').value) url += '&status=' + $('fStatus').value;
    var r = await api('GET', url);
    loadedTasks = r.data || [];
    renderTasks();
  } catch (e) { showMsg(e.message); }
}

function renderTasks() {
  var view = $('fDateSection').value;
  var list = loadedTasks.filter(function (t) {
    if (view === 'assigned') return Boolean(t.assignedDate || t.createdAt);
    if (view === 'submit') return Boolean(t.submissionDate);
    if (view === 'due') return Boolean(t.dueDate);
    return true;
  });

  var body = $('tasks');
  body.innerHTML = '';
  if (list.length === 0) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#a1a1aa;">No tasks found.</td></tr>';
    return;
  }

  list.forEach(function (t) {
    var tr = document.createElement('tr');
    var isLate = t.dueDate && t.status !== 'done' && new Date(t.dueDate) < new Date();

    // Indicator logic: Done = green, Due = red, Todo/In Progress = yellow
    var indText = 'Todo';
    var indClass = 'yellow';
    if (t.status === 'done') {
      indText = 'Done'; indClass = 'green';
    } else if (isLate || (t.dueDate && new Date(t.dueDate) <= new Date())) {
      indText = 'Due'; indClass = 'red';
    } else if (t.status === 'in_progress') {
      indText = 'In Progress'; indClass = 'yellow';
    }

    var assigned = t.assignedDate ? t.assignedDate.slice(0, 10) : (t.createdAt ? t.createdAt.slice(0, 10) : '-');
    var submit = t.submissionDate ? t.submissionDate.slice(0, 10) : '-';
    var due = t.dueDate ? t.dueDate.slice(0, 10) : '-';

    tr.innerHTML = 
      '<td><strong>' + t.title + '</strong></td>' +
      '<td><span class="badge ' + (t.priority || 'medium') + '">' + (t.priority || 'medium') + '</span></td>' +
      '<td>' + assigned + '</td>' +
      '<td>' + submit + '</td>' +
      '<td class="' + (isLate ? 'late' : '') + '">' + due + (isLate ? ' (Late)' : '') + '</td>' +
      '<td><select onchange="updateStatus(\'' + t.id + '\', this.value)">' +
        '<option value="todo"' + (t.status === 'todo' ? ' selected' : '') + '>todo</option>' +
        '<option value="in_progress"' + (t.status === 'in_progress' ? ' selected' : '') + '>in progress</option>' +
        '<option value="done"' + (t.status === 'done' ? ' selected' : '') + '>done</option>' +
      '</select></td>' +
      '<td><span class="ind ' + indClass + '">' + indText + '</span></td>' +
      '<td><button class="red" onclick="deleteTask(\'' + t.id + '\')">Delete</button></td>';

    body.appendChild(tr);
  });
}

async function addTask() {
  if (!projectId) return showMsg('Create or select a project first');
  var title = $('taskTitle').value.trim();
  if (!title) return showMsg('Enter task title');

  var body = {
    title: title,
    projectId: projectId,
    priority: $('taskPriority').value
  };
  if ($('taskAssigned').value) body.assignedDate = $('taskAssigned').value;
  if ($('taskSubmit').value) body.submissionDate = $('taskSubmit').value;
  if ($('taskDue').value) body.dueDate = $('taskDue').value;

  try {
    await api('POST', '/api/tasks', body);
    $('taskTitle').value = '';
    $('taskSubmit').value = '';
    $('taskDue').value = '';
    showMsg('');
    loadTasks();
  } catch (e) { showMsg(e.message); }
}

async function updateStatus(id, status) {
  try {
    await api('PATCH', '/api/tasks/' + id + '/status', { status: status });
    loadTasks();
  } catch (e) { showMsg(e.message); }
}

async function deleteTask(id) {
  try {
    await api('DELETE', '/api/tasks/' + id);
    loadTasks();
  } catch (e) { showMsg(e.message); }
}

// Init auth
if (token) {
  api('GET', '/api/auth/me').then(function (r) { start(r.data); }).catch(logout);
} else {
  window.location.href = '/login.html';
}
</script>
</body>
</html>
