<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login Form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <div class="circle-container" id="circle-Container"></div>
      <div class="login-box">
        <h3 class="title" id="title">login</h3>
        <form id="login-Form">
          <div class="input-group" id="nameGroup" hidden>
            <input type="text" id="name" placeholder="name" />
            <span class="input-icon">
              <i class="fa-solid fa-user"></i>
            </span>
          </div>
          <div class="input-group">
            <input type="email" id="email" placeholder="email" required />
            <span class="input-icon">
              <i class="fa-solid fa-envelope"></i>
            </span>
          </div>
          <div class="input-group">
            <input type="password" id="password" placeholder="Password" required />
            <span class="input-icon">
              <i class="fa-solid fa-lock"></i>
            </span>
          </div>
          <div class="forget-password">
            <a href="#">forget your password ?</a>
          </div>
          <p id="msg"></p>
          <button type="submit" class="login-btn" id="submitBtn">login</button>
        </form>
        <div class="signup-link">
          <a href="#" id="switchLink">sign up</a>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
